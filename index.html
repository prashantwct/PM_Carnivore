<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Pinch-zoom is left enabled on purpose. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b5e20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PM F1">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Carnivore PM Form F1</title>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div class="brand"><strong>Carnivore PM · Form F1</strong><span id="draftState" role="status">Draft</span></div>
      <button type="button" id="stepsBtn" class="btn ghost sm" aria-haspopup="dialog">☰ Steps</button>
    </div>
    <div id="bar" class="bar" role="progressbar" aria-label="Progress" aria-valuemin="1" aria-valuemax="13" aria-valuenow="1"><div id="barFill"></div></div>
    <div class="stepline"><span id="stepNo"></span><h1 id="stepTitle"></h1></div>
  </header>

  <main id="stage"></main>

  <nav class="bottom" aria-label="Step navigation">
    <button type="button" id="back" class="btn ghost">‹ Back</button>
    <button type="button" id="next" class="btn primary">Next ›</button>
  </nav>

  <dialog id="stepsDlg" aria-label="All steps">
    <div class="dlg-head"><strong>All steps</strong><button type="button" id="closeSteps" class="btn ghost sm">Close</button></div>
    <p class="hint">○ not started &nbsp; ◐ partly filled &nbsp; ● complete</p>
    <ol id="stepList"></ol>
  </dialog>

  <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
  <input type="file" id="galIn" accept="image/*" multiple hidden>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="form.js"></script>
  <script src="pdf.js"></script>
  <script src="app.js"></script>
</body>
</html>
